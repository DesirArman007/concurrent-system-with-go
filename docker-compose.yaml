services:
  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"

  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image:  rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIES_HOSTS=local:redis:6379
    ports:
      - "8081:8001"
    user: redis